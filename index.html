<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker Kuliah</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Task Tracker Kuliah</h1>

  <form id="form">
    <input id="judul" placeholder="Judul tugas">
    <input id="matkul" placeholder="Mata kuliah">
    <input id="deadline" type="date">
    <button>Tambah</button>
    <p id="error"></p>
  </form>

  <div id="filter">
    <button data-filter="semua" class="on">Semua</button>
    <button data-filter="aktif">Aktif</button>
    <button data-filter="selesai">Selesai</button>
  </div>

  <p id="counter"></p>
  <ul id="daftar"></ul>
  <p id="kosong">Belum ada tugas.</p>
</body>
</html>
